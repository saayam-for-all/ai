[pytest]
# The suite lives in tests/. Keeping testpaths explicit stops pytest walking
# the whole tree and collecting anything that happens to start with "test".
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The repository root has to be importable so `import lambda_function` works
# from inside tests/ without every file rewriting sys.path.
pythonpath = .

# Unregistered markers are a typo waiting to silently skip a test slice.
addopts =
    --strict-markers
    --strict-config
    -ra
    --import-mode=importlib
    -m "not needs_network"

norecursedirs = __pycache__ .git .github build dist *.egg-info

markers =
    unit: one function, all collaborators mocked, no I/O.
    contract: the shape of what crosses a boundary - the Lambda event in, the JSON envelope out. These mirror what the browser actually sees.
    dataset: assertions over shipped data files such as services/emergency_numbers.json.
    integration: more than one module together, still hermetic (fakes at the process edge).
    slow: takes more than a second.
    needs_network: hits a live LLM, geocoder or database. Excluded from the default run and from CI.

filterwarnings =
    ignore::DeprecationWarning:google.genai.types
