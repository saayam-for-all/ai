name: Python Flask CI Pipeline

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:  # Allows manual "Run workflow" from GitHub Actions tab
  push:
    branches: ["test", "dev", "main", "feature/ci-build-divyatanwar"]
  pull_request:
    branches: ["test", "dev", "main", "feature/ci-build-divyatanwar"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # FIX: prevent hung jobs (torch installs can be slow)
    env:
      PYTHONUNBUFFERED: 1
      PYTHONFAULTHANDLER: 1
    defaults:
      run:
        working-directory: .
        shell: bash

    steps:
      # --- CODE: Checkout source ---
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 
        with:
          fetch-depth: 0  

      - name: Show pipeline info
        run: |
          echo "=== Pipeline context ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"

      # --- Set up Python (with pip cache) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Print Python and pip versions  # FIX: environment debugging
        run: |
          python --version
          pip --version

      # --- Cache virtualenv (skip install when deps unchanged) ---
      - name: Cache virtualenv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Cache status
        run: |
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Cache HIT - skipping dependency install"
          else
            echo "⬜ Cache MISS - will install dependencies"
          fi

      # --- BUILD/PACKAGE: Install dependencies ---
      # FIX - added venv validity guard so a corrupted/stale cache doesn't silently break all downstream steps
      - name: Build and install package
        env:
          PIP_PROGRESS_BAR: off
          PIP_DISABLE_PIP_VERSION_CHECK: 1
        run: |
          echo "=== Build and install package (output below) ==="
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ] || [ ! -f .venv/bin/activate ]; then
            echo "Note: torch + transformers are large (~2GB). First install can take 15-20 min."
            python -m venv .venv
            source .venv/bin/activate
            echo "--- Upgrading pip ---"
            pip install --upgrade pip setuptools wheel
            echo "--- Installing requirements.txt ---"
            pip install -r requirements.txt
            echo "--- Installing project + pytest-cov, bandit, flake8 ---"
            pip install pytest-cov bandit flake8
            echo "=== Install complete ==="
          else
            echo "✅ Valid venv found in cache, skipping install."
          fi

      # --- TESTS [SAST]: Static Application Security Testing ---
      # FIX - changed -lll to -ll for broader security coverage
      - name: SAST with Bandit
        run: |
          echo "=== SAST with Bandit (output below) ==="
          source .venv/bin/activate
          bandit app.py MetaAIAPI_app.py -ll -f screen

      # --- CODE COVERAGE: Run tests with coverage ---
      - name: Verify app import (quick check before tests)
        run: |
          source .venv/bin/activate
          echo "Testing if app module can be imported..."
          python -u -c "from app import app, categories; print('Import OK')"

      - name: Run tests with coverage
        run: |
          echo "=== Pytest with coverage (output below) ==="
          source .venv/bin/activate
          python -u -m pytest test_app.py --cov=app --cov-report=xml --cov-report=term-missing -v -s --tb=short
      # - name: Run tests with coverage
      #   run: |
      #     echo "=== Pytest with coverage (output below) ==="
      #     source .venv/bin/activate
      #     python -u -m pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v -s --tb=short

      # FIX: upload coverage.xml as an artifact instead of generating and discarding it
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # --- Lint (code quality) ---
      # FIX: changed `*.py` to `.` so sub-packages are also linted
      # - name: Lint with flake8
      #   run: |
      #     echo "=== Flake8 lint (output below) ==="
      #     source .venv/bin/activate
      #     flake8 . --max-line-length=150

      # - name: Lint with flake8
      #   run: |
      #     echo "=== Flake8 lint (output below) ==="
      #     source .venv/bin/activate
      #     flake8 . --max-line-length=150 --exclude=.venv,__pycache__,.git,build,dist

  # --- BUILD DOCKER IMAGE AND PUSH: Docker build job ---
  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # FIX: added timeout
    needs: build-and-test
    # FIX: run on both push AND pull_request 
    # This ensures a broken Dockerfile is caught before merge.
    permissions:
      contents: read
      id-token: write  # for OIDC with AWS (if using ECR)
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false  # Never push from this job unless ECR steps below are enabled
          tags: saayam-ai-assistant:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

