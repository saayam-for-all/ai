  name: Python Flask CI Pipeline

  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

  on:
    workflow_dispatch:

    push:
      branches:
        - test
        - dev
        - main
      #dhara-start
      # This tells GitHub to run my feature branch update, remove this later!
        - 'dhara0611/feature-ci-cd' 
      #dhara-end

    pull_request:
      branches:
        - test
        - dev
        - main
      types:
        - opened
        - synchronize
        - reopened

  jobs:
    build-and-test:
      runs-on: ubuntu-latest
      timeout-minutes: 40  # FIX: prevent hung jobs (torch installs can be slow)
      env:
        PYTHONUNBUFFERED: 1
        PYTHONFAULTHANDLER: 1
      defaults:
        run:
          working-directory: .
          shell: bash

      steps:
        # --- CODE: Checkout source ---
        - name: Checkout repository
          uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 
          with:
            fetch-depth: 0  

        - name: Show pipeline info
          run: |
            echo "=== Pipeline context ==="
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Event: ${{ github.event_name }}"

        # --- Set up Python (with pip cache) ---
        - name: Set up Python
          id : setup-python
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"
            #cache: "pip"

        - name: Print Python and pip versions  # FIX: environment debugging
          run: |
            python --version
            pip --version

        # --- Cache virtualenv (skip install when deps unchanged) ---
        - name: Cache virtualenv
          uses: actions/cache@v4
          id: cache-venv
          with:
            path: .venv
            key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.pythonLocation }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
            restore-keys: |
              ${{ runner.os }}-venv-${{ steps.setup-python.outputs.pythonLocation }}
              ${{ runner.os }}-venv-


        - name: Cache status
          run: |
            if [ "${{ steps.cache-venv.outputs.cache-hit }}" = "true" ]; then
              echo "✅ Cache HIT - skipping dependency install"
            else
              echo "⬜ Cache MISS - will install dependencies"
            fi

        # --- BUILD/PACKAGE: Install dependencies ---
        # FIX - added venv validity guard so a corrupted/stale cache doesn't silently break all downstream steps
        - name: Build and install package
          env:
            PIP_PROGRESS_BAR: off
            PIP_DISABLE_PIP_VERSION_CHECK: 1
          run: |
            echo "=== Build and install package (output below) ==="
            if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ] || [ ! -f .venv/bin/activate ]; then
              echo "Note: torch + transformers are large (~2GB). First install can take 15-20 min."
              python -m venv .venv
              source .venv/bin/activate
              echo "--- Upgrading pip ---"
              pip install --upgrade pip setuptools wheel

              # PyTorch is not required by the Lambda deployment.
              # pip install torch --index-url https://download.pytorch.org/whl/cpu

              echo "--- Installing requirements.txt ---"
              pip install -r requirements.txt
              echo "--- Installing project + pytest-cov, bandit, flake8 ---"
              pip install pytest-cov bandit flake8
              echo "=== Install complete ==="
            else
              echo "✅ Valid venv found in cache, skipping install."
            fi

        # --- TESTS [SAST]: Static Application Security Testing ---
        # FIX - changed -lll to -ll for broader security coverage
        - name: SAST with Bandit
          #dhara0611-remove this line later "continue on error" 
          continue-on-error: true 
          run: |
            echo "=== SAST with Bandit (output below) ==="
            source .venv/bin/activate
            bandit app.py MetaAIAPI_app.py -ll -f screen

        # --- CODE COVERAGE: Run tests with coverage ---
        - name: Verify app import (quick check before tests)
          run: |
            source .venv/bin/activate
            echo "Testing if app module can be imported..."
            python -u -c "from app import app, categories; print('Import OK')"

        - name: Run tests with coverage
          run: |
            echo "=== Pytest with coverage (output below) ==="
            source .venv/bin/activate
            python -u -m pytest test_app.py --cov=app --cov-report=xml --cov-report=term-missing -v -s --tb=short
        # - name: Run tests with coverage
        #   run: |
        #     echo "=== Pytest with coverage (output below) ==="
        #     source .venv/bin/activate
        #     python -u -m pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v -s --tb=short

        # FIX: upload coverage.xml as an artifact instead of generating and discarding it
        - name: Upload coverage report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: coverage-report
            path: coverage.xml

        # --- Lint (code quality) ---
        # FIX: changed `*.py` to `.` so sub-packages are also linted
        # - name: Lint with flake8
        #   run: |
        #     echo "=== Flake8 lint (output below) ==="
        #     source .venv/bin/activate
        #     flake8 . --max-line-length=150

        # - name: Lint with flake8
        #   run: |
        #     echo "=== Flake8 lint (output below) ==="
        #     source .venv/bin/activate
        #     flake8 . --max-line-length=150 --exclude=.venv,__pycache__,.git,build,dist
        
        #dhara0611-start
        ## --- PACKAGING: Zip the Python app + dependencies ---
        - name: Package Application for AWS Lambda
          run: |
            echo "===1. Creating code package ==="
            rm -rf dist_code dist_layer_useful dist_layer_unused \
              lambda-code.zip lambda-layer-useful.zip lambda-layer-unused.zip
            mkdir -p dist_code
            #Copy ONLY business logic files and directories
            cp lambda_function.py dist_code/
            cp -r utils services dist_code/

            cd dist_code
            zip -r ../lambda-code.zip .
            cd ..

            echo "=== 2. Creating useful Lambda dependencies layer ==="
            mkdir -p dist_layer_useful/python
            python -m pip install --no-cache-dir \
              --target dist_layer_useful/python \
              langchain-core langchain-groq langchain-google-genai \
              psycopg2-binary aws-lambda-powertools boto3
            
            find dist_layer_useful/python/ -type d -name "__pycache__" -exec rm -rf {} +
            find dist_layer_useful/python/ -type d -name "tests" -exec rm -rf {} +
            
            cd dist_layer_useful && zip -r ../lambda-layer-useful.zip . && cd ..

            echo "=== 3. Creating unused dependency archive ==="
            mkdir -p dist_layer_unused/python
            # Preserve the full existing environment for storage or future use only.
            cp -r .venv/lib/python3.11/site-packages/* dist_layer_unused/python/
            find dist_layer_unused/python/ -type d -name "__pycache__" -exec rm -rf {} +
            find dist_layer_unused/python/ -type d -name "tests" -exec rm -rf {} +
            cd dist_layer_unused && zip -r ../lambda-layer-unused.zip . && cd ..

            echo "=== Lambda package sizes ==="
            du -sh lambda-code.zip lambda-layer-useful.zip lambda-layer-unused.zip

            echo "=== Packaging complete ==="

        # Save the package to GitHub storage so the upcoming deploy job can access it
        - name: Upload Build Artifact to GitHub
          uses: actions/upload-artifact@v4
          with:
            name: compiled-build-archive
            path: |
              lambda-code.zip
              lambda-layer-useful.zip
              lambda-layer-unused.zip
        #dhara0611-end


    # --- BUILD DOCKER IMAGE AND PUSH: Docker build job ---
    # commenting the build-docker step
