    #dhara0611-start
    deploy:
      needs: build-and-test
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      runs-on: ubuntu-latest
      
      env:
        AWS_REGION: "us-east-1"      # <-- Update to your AWS Region
        S3_BUCKET: "saayam-virginia-private" # <-- Update to your S3 Bucket Name
        APP_NAME: "ai-app"
      
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        
        # Download the lambda-code.zip and lambda-layer.zip packages from GitHub's storage
        - name: Download Build Artifact from GitHub
          uses: actions/download-artifact@v4
          with:
            name: compiled-build-archive
            path: ./
        
        - name: Generate Version Tag
          id: ver
          shell: bash
          run: |
            DATE_UTC=$(date -u +%Y%m%d-%H%M)
            VERSION_TAG="v1.0.0-${DATE_UTC}"

            echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT
            # Explicit naming rules for both files
            echo "code_archive_name=${{ env.APP_NAME }}-code-${VERSION_TAG}.zip" >> $GITHUB_OUTPUT
            echo "useful_archive_name=${{ env.APP_NAME }}-useful-layer-${VERSION_TAG}.zip" >> $GITHUB_OUTPUT
            echo "unused_archive_name=${{ env.APP_NAME }}-unused-layer-${VERSION_TAG}.zip" >> $GITHUB_OUTPUT

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-region: ${{ env.AWS_REGION }}
            aws-access-key-id: ${{ secrets.AWS_AI_ACCESS_KEY }}
            aws-secret-access-key: ${{ secrets.AWS_AI_SECRET_ACCESS_KEY }}
        
         # --- BRANCH STRATEGY 2: DEV BRANCH DEPLOYMENT ---
        - name: Upload to S3 Bucket (Dev Branch)
          id: upload-to-s3
          if: github.ref_name == 'dev' || github.ref_name == 'dhara0611/feature-ci-cd'
          run: |
            echo "Uploading split zip archives to S3 (dev)..."
            CODE_S3_KEY="code/dev/ai/v1.0.0/${{ steps.ver.outputs.code_archive_name }}"
            USEFUL_S3_KEY="code/dev/ai/v1.0.0/${{ steps.ver.outputs.useful_archive_name }}"
            UNUSED_S3_KEY="code/dev/ai/v1.0.0/${{ steps.ver.outputs.unused_archive_name }}"
            
            
            # Copy both packages up to AWS storage
            aws s3 cp "lambda-code.zip" "s3://${{ env.S3_BUCKET }}/$CODE_S3_KEY"
            aws s3 cp "lambda-layer-useful.zip" "s3://${{ env.S3_BUCKET }}/$USEFUL_S3_KEY"
            aws s3 cp "lambda-layer-unused.zip" "s3://${{ env.S3_BUCKET }}/$UNUSED_S3_KEY"
            
            # Export both paths to downstream steps
            echo "code_s3_key=$CODE_S3_KEY" >> "$GITHUB_OUTPUT"
            echo "useful_s3_key=$USEFUL_S3_KEY" >> "$GITHUB_OUTPUT"
            echo "unused_s3_key=$UNUSED_S3_KEY" >> "$GITHUB_OUTPUT"



        - name: Create or update AWS Lambda and Layers from S3 (Dev Branch)
          if: github.ref_name == 'dev' || github.ref_name == 'dhara0611/feature-ci-cd'
          run: |
            LAMBDA_FUNCTION_NAME="${{ env.APP_NAME }}-dev"
            CODE_KEY="${{ steps.upload-to-s3.outputs.code_s3_key }}"
            USEFUL_KEY="${{ steps.upload-to-s3.outputs.useful_s3_key }}"

            echo "Publishing useful dependency layer..."
            USEFUL_LAYER_ARN=$(aws lambda publish-layer-version \
              --layer-name "${{ env.APP_NAME }}-dev-useful-dependencies" \
              --content "S3Bucket=${{ env.S3_BUCKET }},S3Key=$USEFUL_KEY" \
              --compatible-runtimes "python3.11" \
              --query "LayerVersionArn" --output text)

            echo "Useful dependency layer to apply: $USEFUL_LAYER_ARN"

            if aws lambda get-function \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              >/dev/null 2>&1; then
              echo "Updating existing Lambda function: $LAMBDA_FUNCTION_NAME"

              #1. Update the execution code
              aws lambda update-function-code \
                --function-name "$LAMBDA_FUNCTION_NAME" \
                --s3-bucket "${{ env.S3_BUCKET }}" \
                --s3-key "$CODE_KEY" \
                --no-publish
              aws lambda wait function-updated \
                --function-name "$LAMBDA_FUNCTION_NAME"
              
              #2. Update configuration to attach freshly updated dependency layer
              aws lambda update-function-configuration \
                --function-name "$LAMBDA_FUNCTION_NAME" \
                --layers "$USEFUL_LAYER_ARN"

            else
              echo "Creating Lambda function: $LAMBDA_FUNCTION_NAME"

              aws lambda create-function \
                --function-name "$LAMBDA_FUNCTION_NAME" \
                --runtime python3.11 \
                --handler lambda_function.lambda_handler \
                --role "${{ secrets.AWS_AI_LAMBDA_ROLE_ARN }}" \
                --code "S3Bucket=${{ env.S3_BUCKET }},S3Key=$CODE_KEY" \
                --layers "$USEFUL_LAYER_ARN" \
                --timeout 120 \
                --memory-size 1024 \
                --no-publish
              aws lambda wait function-active \
                --function-name "$LAMBDA_FUNCTION_NAME"
            fi
    #dhara-end
        