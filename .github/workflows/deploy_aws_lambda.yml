name: Deploy to AWS Lambda

on:
  push:
    branches:
      - generate-subject

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and prepare package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t package

          # Copy all .py files
          cp -r *.py package/

          # Copy utils folder
          cp -r utils package/utils

      - name: Zip deployment package
        run: |
          cd package
          zip -r ../deployment.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.GEN_SUB_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.GEN_SUB_AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.GEN_SUB_AWS_LAMBDA_ARN }} \
            --zip-file fileb://deployment.zip