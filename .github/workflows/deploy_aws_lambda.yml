name: Deploy to AWS Lambda

on:
  push:
    branches:
      - conversational-chatbot-aws

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and prepare package
        run: |
          rm -rf package deployment.zip
          mkdir -p package

          # Install Lambda-compatible wheels to avoid GLIBC runtime mismatch.
          pip install --upgrade pip
          pip install \
            --requirement requirements.txt \
            --target package \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all:

          # Copy application code into package
          cp -r *.py package/
          cp -r services package/services
          cp -r utils package/utils

      - name: Zip deployment package
        run: |
          cd package
          zip -r ../deployment.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PRED_CAT_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.PRED_CAT_AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.PRED_CAT_AWS_LAMBDA_ARN }} \
            --zip-file fileb://deployment.zip