name: Python Flask CI Pipeline

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:  # Allows manual "Run workflow" from GitHub Actions tab
  push:
    branches: ["test", "dev", "main", "feature/ci-build-divyatanwar"]
  pull_request:
    branches: ["test", "dev", "main", "feature/ci-build-divyatanwar"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      PYTHONFAULTHANDLER: 1
    defaults:
      run:
        working-directory: .
        shell: bash

    steps:
      # --- CODE: Checkout source ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better visibility

      - name: Show pipeline info
        run: |
          echo "=== Pipeline context ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"

      # --- Set up Python (with pip cache) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --- Cache virtualenv (skip install when deps unchanged) ---
      - name: Cache virtualenv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Cache status
        run: |
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Cache HIT - skipping dependency install"
          else
            echo "⬜ Cache MISS - will install dependencies"
          fi

      # --- BUILD/PACKAGE: Install only on cache miss ---
      - name: Build and install package
        if: steps.cache-venv.outputs.cache-hit != 'true'
        env:
          PIP_PROGRESS_BAR: off
          PIP_DISABLE_PIP_VERSION_CHECK: 1
        run: |
          echo "=== Build and install package (output below) ==="
          echo "torch + transformers are large (~2GB). First install can take 15–20 min."
          python -m venv .venv
          source .venv/bin/activate
          echo "--- Upgrading pip ---"
          pip install --upgrade pip
          echo "--- Installing requirements.txt ---"
          pip install -r requirements.txt
          echo "--- Installing project + pytest-cov, bandit, flake8 ---"
          pip install -e . pytest-cov bandit flake8
          echo "=== Install complete ==="


      # --- TESTS [SAST]: Static Application Security Testing ---
      - name: SAST with Bandit
        run: |
          echo "=== SAST with Bandit (output below) ==="
          source .venv/bin/activate
          bandit app.py MetaAIAPI_app.py -lll -f screen

      # --- CODE COVERAGE: Run tests with coverage ---
      - name: Verify app import (quick check before tests)
        run: |
          source .venv/bin/activate
          echo "Testing if app module can be imported..."
          python -u -c "from app import app, categories; print('Import OK')"
      - name: Run tests with coverage
        run: |
          echo "=== Pytest with coverage (output below) ==="
          source .venv/bin/activate
          python -u -m pytest test_app.py --cov=app --cov-report=xml --cov-report=term-missing -v -s --tb=short

      # --- Lint (code quality) ---
      - name: Lint with flake8
        run: |
          echo "=== Flake8 lint (output below) ==="
          source .venv/bin/activate
          flake8 *.py --max-line-length=150

  # --- BUILD DOCKER IMAGE AND PUSH: Docker build job ---
  build-docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write  # for OIDC with AWS (if using ECR)
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: saayam-ai-assistant:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment and configure for ECR push when ready:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ secrets.AWS_REGION }}
