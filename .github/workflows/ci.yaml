name: Python Flask CI Pipeline

on:
  push:
    branches: ["test", "dev", "main", "feature/ci-build-divyatanwar"]
  pull_request:
    branches: ["test", "dev", "main", "feature/ci-build-divyatanwar"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
        shell: bash

    steps:
      # --- CODE: Checkout source ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Set up Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- Cache dependencies ---
      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      # --- BUILD/PACKAGE: Install and build the project ---
      - name: Build and install package
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest-cov bandit

      # --- TESTS [SAST]: Static Application Security Testing ---
      - name: SAST with Bandit
        run: |
          source .venv/bin/activate
          bandit -r . -x .venv,.git -ll

      # --- CODE COVERAGE: Run tests with coverage ---
      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          python -m pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      # --- Lint (code quality) ---
      - name: Lint with flake8
        run: |
          source .venv/bin/activate
          pip install flake8
          flake8 *.py --max-line-length=150

  # --- BUILD DOCKER IMAGE AND PUSH: Docker build job ---
  build-docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write  # for OIDC with AWS (if using ECR)
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: saayam-ai-assistant:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment and configure for ECR push when ready:
